services:
  - type: web
    name: agrimart
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrimart-db
          property: connectionString

databases:
  - name: agrimart-db
    databaseName: agrimart
    user: agrimart
    plan: free
